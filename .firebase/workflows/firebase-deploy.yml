name: Deploy to Firebase (Hosting & Functions)

on:
  push:
    branches:
      - main # 當代碼合併或推送到 main 分支時觸發自動部署

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 使用與 Firebase Functions 相容的 Node 版本
          cache: 'npm'

      # 3. 編譯前端（Firebase Hosting 靜態檔案）
      - name: Install Frontend Dependencies & Build
        run: |
          npm install
          npm run build

      # 4. 編譯後端（Firebase Functions 程式碼）
      - name: Install Functions Dependencies & Build
        run: |
          cd functions
          npm install
          npm run build
          cd ..

      # 5. 部署至 Firebase
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

