name: Full-Stack Quality Gate & CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate-and-audit:
    name: Architecture, Security, Performance & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: cd functions && npm ci

      - name: Run Custom Quality Gate Audits (Security, Perf, Cost)
        run: |
          npm run audit:security
          npm run audit:perf
          npm run audit:cost

      - name: Run Type Checking, Tests and Build
        run: npm run lint && npm run test && npm run build

      - name: Verify Bundle Size Limits
        run: |
          size=$(stat -c%s "dist/server.cjs")
          echo "Server bundle size: $size bytes"
          if [ $size -gt 350000 ]; then
            echo "Error: Server bundle size exceeds 350KB limit"
            exit 1
          else
            echo "✅ Server bundle size is within acceptable threshold (< 350KB)"
          fi

      - name: Run Lighthouse CI (Performance & FCP Assertion)
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-Test Hygiene (Clean Artifacts)
        run: npm run clean:artifacts
