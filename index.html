    <script>
      // Global error listener to automatically reload with cache-busting ONLY if a critical local asset fails
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || (e.target.tagName === 'LINK' && e.target.rel === 'stylesheet'))) {
          const src = e.target.src || e.target.href;
          // Only trigger for local assets (our app JS/CSS), ignore Google Fonts or external trackers
          if (src && src.startsWith(window.location.origin)) {
            console.warn('[Sabay] Critical local resource load failed:', src);
            
            const key = 'sabay_chunk_recovery_lock';
            const lastRetry = parseInt(window.sessionStorage.getItem(key) || '0', 10);
            const now = Date.now();
            
            if (now - lastRetry > 10000) { // 10s debounce, shared with chunkRecovery
              window.sessionStorage.setItem(key, now.toString());
              const url = new URL(window.location.href);
              url.searchParams.set('_v', now.toString());
              window.location.replace(url.toString());
            }
          }
        }
      }, true);
    </script>
